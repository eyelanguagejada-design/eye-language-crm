<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eye Language CRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eye Language CRM">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
            align-items: center; justify-content: center; color: #555;
            font-family: system-ui, sans-serif; transition: opacity .3s; }
  #loader img { width: 84px; height: 84px; border-radius: 20px; }
  #loader.hide { opacity: 0; pointer-events: none; }
  #refresh { position: fixed; z-index: 10; top: calc(8px + env(safe-area-inset-top)); left: 8px;
             width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
             background: rgba(26,115,232,.92); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25);
             display: flex; align-items: center; justify-content: center; padding: 0; }
  #refresh:active { transform: scale(.92); }
  #refresh svg { width: 22px; height: 22px; }
  #refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="loader"><img src="icon-192.png" alt=""><div>جاري التحميل…</div></div>
  <button id="refresh" title="تحديث الصفحة" aria-label="تحديث الصفحة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <iframe id="app" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
  // ⬇️ لينك Apps Script بتاعك (لو عملت نشر جديد غيّره هنا)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzSZJvclkQbdsHqguzykQIMLtzNM-hVaL8W5CHB7yjIRIGszdI3SHbBQpbWFEaQRX5l/exec';

  const isInstalled = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  // أول مرة من المتصفح؟ وديه على صفحة التثبيت
  if (!isInstalled && !sessionStorage.getItem('skipInstall') && !location.search.includes('web')) {
    location.replace('install.html');
  }

  const frame = document.getElementById('app');
  const refreshBtn = document.getElementById('refresh');
  frame.onload = () => { if (frame.src === 'about:blank') return; document.getElementById('loader').classList.add('hide'); refreshBtn.classList.remove('spin'); };
  frame.src = APP_URL;

  // التنقل بين صفحات النظام يفضل جوه التطبيق
  const loader = document.getElementById('loader');
  addEventListener('message', e => {
    let host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/\.googleusercontent\.com$/.test(host)) return;
    const d = e.data;
    if (!d || d.type !== 'EL_NAV' || typeof d.url !== 'string') return;
    if (d.url.indexOf('https://script.google.com/') !== 0) return;
    loader.classList.remove('hide');
    frame.src = d.url;
  });

  // زرار التحديث: يعيد تحميل الصفحة الحالية جوه التطبيق
  refreshBtn.addEventListener('click', () => {
    refreshBtn.classList.add('spin');
    loader.classList.remove('hide');
    const src = frame.src;
    frame.src = 'about:blank';
    setTimeout(() => { frame.src = src; }, 50);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
